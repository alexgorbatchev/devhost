name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about seven minutes. Without a limit, a step that hangs holds the runner for six hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: just ui install-browser

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip xvfb

      - name: Run checks
        run: just check

  # Keep advisory native verification available without spending a macOS runner on every change.
  go-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Go checks
        run: just devhost check
