name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about seven minutes. Without a limit, a step that hangs holds the runner for six hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: just ui install-browser

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip

      - name: Run checks
        run: just check

  # devhost ships a macOS binary, but nothing ran its tests there before this job. It reports without failing the
  # workflow; remove continue-on-error once it passes reliably.
  go-macos:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Go checks
        run: just devhost check
