name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      selfHosted:
        description: Run a Linux-only pilot without enabling automatic local CI
        type: boolean
        default: false
      stress:
        description: Repeat CI regression tests before the full check suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A manual pilot does not enable automatic local CI; forks always stay hosted.
    runs-on: ${{ (vars.SELF_HOSTED_LINUX_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.selfHosted)) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "x64", "linux-ci"]') || 'ubuntu-latest' }}
    # A run takes about seven minutes. Without a limit, a step that hangs holds the runner for six hours.
    timeout-minutes: 30

    steps:
      - name: Verify self-hosted isolation and fresh state
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          test ! -r /proc/1/environ
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test ! -e "$HOME/.ci-job-used"
          touch "$HOME/.ci-job-used"
          findmnt -n -o OPTIONS -T / | grep -Eq '(^|,)ro(,|$)'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: just ui install-browser

      - name: Install test tools
        if: runner.environment != 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip xvfb

      - name: Stress CI regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        run: |
          just devhost build-devtools-bundle
          cd apps/devhost
          go test -count=20 -v -run '^(TestStopStartedServicePreservesLateExternalPortRespawns|TestRecoveryDesignInBrowser)$' ./internal/services ./internal/devtools

      - name: Run checks
        run: just check

  # Keep advisory native verification available without spending a macOS runner on every change.
  go-macos:
    if: github.event_name == 'workflow_dispatch' && !inputs.selfHosted
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/devhost/go.mod
          cache-dependency-path: apps/devhost/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Go checks
        run: just devhost check
