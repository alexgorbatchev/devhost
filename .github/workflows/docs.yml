name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "apps/devhost/README.md"
      - "apps/devhost/devhost.example.toml"
      - "apps/devhost/docs/**"
      - "packages/docs/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install, build, and upload docs
        uses: withastro/action@v6
        with:
          path: packages/docs
          node-version: 24

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
