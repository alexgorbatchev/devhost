name: Publish release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Cache Rust toolchains
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/devhost/rust-toolchain.toml') }}-publish

      - name: Setup pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("apps/devhost/rust-toolchain.toml").text()).toolchain.channel)')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy,llvm-tools-preview --no-self-update
          rustup default "$channel"

      - name: Cache Rust dependencies and test objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/devhost -> target
          key: publish-verify-${{ hashFiles('apps/devhost/rust-toolchain.toml') }}

      - name: Cache native verification tools
        id: tools
        uses: actions/cache@v5
        with:
          path: ~/.local/share/devhost-publish-verify-tools
          key: publish-verify-tools-${{ runner.os }}-${{ runner.arch }}-caddy2.11.9-chisel1.12.0-cov0.9.1

      - name: Install native verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$HOME/.local/share/devhost-publish-verify-tools"
          mkdir -p "$tool_root/bin"
          caddy_archive="caddy_2.11.9_linux_amd64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/caddyserver/caddy/releases/download/v2.11.9/$caddy_archive" --output "$RUNNER_TEMP/$caddy_archive"
          printf '%s  %s\n' '5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb' "$RUNNER_TEMP/$caddy_archive" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/$caddy_archive" -C "$tool_root/bin" caddy
          chmod +x "$tool_root/bin/caddy"
          chisel_archive="chisel_1.12.0_linux_amd64.gz"
          curl --fail --location --retry 3 "https://github.com/jpillora/chisel/releases/download/v1.12.0/$chisel_archive" --output "$RUNNER_TEMP/$chisel_archive"
          printf '%s  %s\n' 'f3f180f1d93aa72cce4e6386f98cc06569a0146fbd65eb4423cf83e6434bcfe6' "$RUNNER_TEMP/$chisel_archive" | shasum -a 256 --check
          gzip -dc "$RUNNER_TEMP/$chisel_archive" > "$tool_root/bin/chisel"
          chmod +x "$tool_root/bin/chisel"
          cargo install --locked cargo-llvm-cov --version 0.9.1 --root "$tool_root"

      - name: Add native tools to PATH
        shell: bash
        run: |
          echo "$HOME/.local/share/devhost-publish-verify-tools/bin" >> "$GITHUB_PATH"
          mkdir -p .cache/test-dependencies
          cp "$HOME/.local/share/devhost-publish-verify-tools/bin/chisel" .cache/test-dependencies/chisel-v1.12.0

      - name: Derive release version from tag
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$release_version" || "$release_version" == "$GITHUB_REF_NAME" ]]; then
            echo "Expected a tag like v1.2.3, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Validate package version matches the release tag
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const metadata = await Bun.file("apps/devhost/metadata.json").json(); console.log(metadata.version);')"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "apps/devhost/metadata.json version ($package_version) must match release tag version ($RELEASE_VERSION)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: just ui install-browser

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip xvfb

      - name: Verify repository and coverage quality gates
        env:
          CI: "false"
        run: |
          set -euo pipefail
          just check
          just devhost coverage

  package:
    needs: verify
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            targets: linux-x64,linux-x64-musl
            rust-targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
            caddy-archive: caddy_2.11.9_linux_amd64.tar.gz
            caddy-sha: 5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            targets: linux-arm64,linux-arm64-musl
            rust-targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
            caddy-archive: caddy_2.11.9_linux_arm64.tar.gz
            caddy-sha: 5e377cff994fc9362a6fcf695c53f226cfca3a3ef85bd3a3687cf252d6310165
          - platform: darwin-arm64
            runner: macos-15
            targets: darwin-arm64
            rust-targets: aarch64-apple-darwin
            caddy-archive: caddy_2.11.9_mac_arm64.tar.gz
            caddy-sha: d075afc620376679a77b453399bf7ada264cab3280b2833e4ed1372abc0c1c13

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("apps/devhost/rust-toolchain.toml").text()).toolchain.channel)')"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustup target add ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies and release objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/devhost -> target
          key: publish-package-${{ matrix.platform }}

      - name: Setup Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache packaging tools
        id: tools
        uses: actions/cache@v5
        with:
          path: ~/.local/share/devhost-publish-package-tools
          key: publish-package-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-zigbuild0.24.1-caddy2.11.9

      - name: Install packaging tools
        if: steps.tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$HOME/.local/share/devhost-publish-package-tools"
          mkdir -p "$tool_root/bin"
          curl --fail --location --retry 3 "https://github.com/caddyserver/caddy/releases/download/v2.11.9/${{ matrix.caddy-archive }}" --output "$RUNNER_TEMP/${{ matrix.caddy-archive }}"
          printf '%s  %s\n' '${{ matrix.caddy-sha }}' "$RUNNER_TEMP/${{ matrix.caddy-archive }}" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/${{ matrix.caddy-archive }}" -C "$tool_root/bin" caddy
          chmod +x "$tool_root/bin/caddy"
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo install --locked cargo-zigbuild --version 0.24.1 --root "$tool_root"
          fi

      - name: Add packaging tools to PATH
        shell: bash
        run: echo "$HOME/.local/share/devhost-publish-package-tools/bin" >> "$GITHUB_PATH"

      - name: Install dependencies without browser setup
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and verify native release archives
        run: just devhost build-release-artifacts --targets=${{ matrix.targets }} --output=apps/devhost/dist/release-${{ matrix.platform }}

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: apps/devhost/dist/release-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packaged release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist-parts

      - name: Assemble and verify all five release archives and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist-parts/release-*/*.tar.gz release-assets/
          cat dist-parts/release-*/SHA256SUMS | sort -k2 > release-assets/SHA256SUMS
          (cd release-assets && sha256sum -c SHA256SUMS)
          for target in darwin-arm64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            archive="release-assets/devhost-v${version}-${target}.tar.gz"
            test -f "$archive"
            entries="$(tar -tzf "$archive" | grep -v '/$' | sort)"
            expected="$(printf 'devhost-v%s-%s/%s\n' \
              "$version" "$target" "LICENSE" \
              "$version" "$target" "README.md" \
              "$version" "$target" "THIRD_PARTY_LICENSES.txt" \
              "$version" "$target" "devhost" | sort)"
            if [[ "$entries" != "$expected" ]]; then
              echo "Unexpected archive layout in $archive:" >&2
              printf '%s\n' "$entries" >&2
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME; reusing it."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --latest

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz release-assets/SHA256SUMS --clobber

  # Deploys the docs built from the release tag, and only after the release exists.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
