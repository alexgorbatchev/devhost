[package]
name = "devhost"
version = "0.0.21"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
default-run = "devhost"

# Optimize production throughput while preserving unwinding used by lifecycle cleanup.
# Development and test profiles keep Cargo's debug and incremental defaults.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "devhost"
path = "src/main.rs"

[dependencies]
agent-watcher = { git = "https://github.com/alexgorbatchev/agent-watcher-rust.git", rev = "f5cf3667bb55cc2bb2b01d4079b92511b9f28005" }
async-tungstenite = { version = "0.34.1", features = ["tokio-rustls-native-certs"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["env"] }
clap_complete = "4.6.11"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
glob = "0.3"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
http-range = "0.1.6"
http-serve = "0.4.0-rc.2"
futures-util = "0.3"
flate2 = "1"
httpdate = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
hyper = "1"
hyper-rustls = { version = "0.27.10", default-features = false, features = [
  "http1",
  "http2",
  "native-tokio",
  "ring",
  "tls12",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
include_dir = "0.7"
libc = "0.2"
makiko = { version = "0.2.5", path = "vendor/makiko" }
mime_guess = "2"
mime-sniffer = "0.1.3"
notify = "9.0.0"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
rustls-webpki = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
socket2 = "0.6.5"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
toml = "1.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
jiff = { version = "1.0.2", default-features = false, features = ["std"] }
anstyle-parse = "1"
unicode-width = "0.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
