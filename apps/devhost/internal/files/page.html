<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{.Title}}</title>
    <style>
      {{.CSS}}
    </style>
    <style>
      body {
        margin: 0;
        background: var(--bgColor-default, #fff);
      }
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }
      header span {
        overflow-wrap: anywhere;
      }
      button {
        color: inherit;
        background: var(--bgColor-muted);
        border: 1px solid var(--borderColor-default);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        flex-shrink: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--fgColor-accent);
        outline-offset: 3px;
      }
      #source {
        display: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      html[data-view="source"] #source {
        display: block;
      }
      html[data-view="source"] #rendered {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
        }
      }
    </style>
    {{if .Markdown}}
    <script>
      (() => {
        const key = "devhost.files.markdown.source";
        let source = false;
        try {
          source = localStorage.getItem(key) === "true";
        } catch {}
        document.documentElement.dataset.view = source ? "source" : "rendered";
        document.addEventListener("DOMContentLoaded", () => {
          const button = document.getElementById("toggle-source");
          const update = () => {
            document.documentElement.dataset.view = source ? "source" : "rendered";
            button.textContent = source ? "Show rendered" : "Show source";
          };
          update();
          button.addEventListener("click", () => {
            source = !source;
            update();
            try {
              localStorage.setItem(key, String(source));
            } catch {}
          });
        });
      })();
    </script>
    {{end}}
  </head>
  <body>
    <main class="markdown-body">
      <header>
        <span>{{.Title}}</span>{{if .Markdown}}<button id="toggle-source" type="button" aria-controls="source rendered">
          Show source</button
        >{{end}}
      </header>
      {{if .Markdown}}
      <article id="rendered">{{.Content}}</article>
      <pre id="source"><code>{{.Source}}</code></pre>
      {{else}}
      <h1>Directory listing</h1>
      <ul>
        {{range .Entries}}
        <li><a href="{{.Href}}">{{.Name}}</a></li>
        {{end}}
      </ul>
      {{end}}
    </main>
  </body>
</html>
