<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{.Title}}</title>
    <script>
      {{.ThemeScript}}
    </script>
    <style>
      {{.CSS}}
    </style>
    <style>
      {{.Styles}}

      .devhost-files {
        width: min(980px, 100%);
      }
      .devhost-files .markdown-body {
        --bgColor-default: var(--dh-surface);
        --bgColor-muted: var(--dh-surface-2);
        --bgColor-neutral-muted: var(--dh-surface-3);
        --fgColor-default: var(--dh-fg);
        --fgColor-muted: var(--dh-fg-muted);
        --fgColor-accent: var(--dh-accent);
        --borderColor-default: var(--dh-line);
        --borderColor-muted: var(--dh-line);
        --borderColor-accent-emphasis: var(--dh-accent);
        min-width: 0;
        font-family: inherit;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--dh-line);
      }
      header .devhost-status__brand {
        margin: 0;
      }
      button {
        color: var(--dh-fg);
        background: var(--dh-surface-2);
        border: 1px solid var(--dh-input-line);
        border-radius: var(--dh-radius-md);
        padding: 10px 14px;
        cursor: pointer;
        flex-shrink: 0;
      }
      button:hover {
        background: var(--dh-surface-3);
      }
      #source {
        display: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      html[data-view="source"] #source {
        display: block;
      }
      html[data-view="source"] #rendered {
        display: none;
      }
    </style>
    {{if .Markdown}}
    <script>
      (() => {
        const key = "devhost.files.markdown.source";
        let source = false;
        try {
          source = localStorage.getItem(key) === "true";
        } catch {}
        document.documentElement.dataset.view = source ? "source" : "rendered";
        document.addEventListener("DOMContentLoaded", () => {
          const button = document.getElementById("toggle-source");
          const update = () => {
            document.documentElement.dataset.view = source ? "source" : "rendered";
            button.textContent = source ? "Show rendered" : "Show source";
          };
          update();
          button.addEventListener("click", () => {
            source = !source;
            update();
            try {
              localStorage.setItem(key, String(source));
            } catch {}
          });
        });
      })();
    </script>
    {{end}}
  </head>
  <body>
    <main class="devhost-status devhost-files">
      <header>
        <span class="devhost-status__brand">devhost / {{.Title}}</span>{{if .Markdown}}<button
          id="toggle-source"
          type="button"
          aria-controls="source rendered"
        >
          Show source</button
        >{{end}}
      </header>
      {{if .Markdown}}
      <article class="markdown-body" id="rendered">{{.Content}}</article>
      <pre class="devhost-status__body" id="source"><code>{{.Source}}</code></pre>
      {{else}}
      <h1 class="devhost-status__label">Directory listing</h1>
      <ul class="devhost-status__list">
        {{range .Entries}}
        <li>
          <a class="devhost-status__link" href="{{.Href}}"
            ><span class="devhost-status__route">{{.Name}}</span
            ><span class="devhost-status__arrow" aria-hidden="true">↗</span></a
          >
        </li>
        {{end}}
      </ul>
      {{end}}
    </main>
  </body>
</html>
