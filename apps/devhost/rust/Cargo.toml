[package]
name = "devhost-rust"
version = "0.0.14"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
default-run = "devhost"

[[bin]]
name = "devhost"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["env"] }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
glob = "0.3"
libc = "0.2"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
rustls-webpki = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
