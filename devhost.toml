name = "devhost"

[caddy.global]
http = true
httpPort = 80
bindHost = "0.0.0.0"

[devtools.shortcuts]
restartServices = "alt+ctrl+r"

[annotation]
defaultAction = "fix"

[[annotation.actions]]
id = "fix"
kind = "agent"

[annotation.actions.agent]
adapter = "pi"

[[annotation.actions]]
id = "ask-claude-code"
kind = "agent"

[annotation.actions.agent]
adapter = "claude-code"

[[annotation.actions]]
id = "ask-opencode"
kind = "agent"

[annotation.actions.agent]
adapter = "opencode"

[[annotation.actions]]
id = "ask-codex"
kind = "agent"

[annotation.actions.agent]
adapter = "codex"

[services.storybook]
primary = true
command = ["sh", "-c", "exec ./node_modules/.bin/storybook dev --ci --port \"$PORT\""]
cwd = "packages/devhost-ui"
port = "auto"
host = "{{ env.DEVHOST_STORYBOOK }}"

[services.storybook.env]
__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS = "{{ env.DEVHOST_STORYBOOK }}"

[services.playground-backend]
command = ["just", "dev"]
cwd = "packages/playground/backend"
port = "auto"
host = "{{ env.DEVHOST_PLAYGROUND }}"
path = "/api/*"

[services.playground-frontend]
command = ["just", "dev"]
cwd = "packages/playground/frontend"
bindHost = "127.0.0.1"
port = "auto"
host = "{{ env.DEVHOST_PLAYGROUND }}"
path = "/"
# Bun HTML/HMR requires Host and Origin to use bindHost plus the assigned port.
proxyLocalOrigin = true
watch = ["src/"]

[services.playground-frontend.env]
NODE_ENV = "development"
