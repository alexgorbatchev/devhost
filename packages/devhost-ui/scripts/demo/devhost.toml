name = "Devhost demo"
killZombies = false

[caddy.global]
adminAddress = "{{ env.DEVHOST_DEMO_ADMIN }}"

[worktrees]
enabled = true

[devtools.editor]
enabled = false

[devtools.chat]
enabled = true

[devtools.annotations]
enabled = true

[services.api]
command = ["bun", "run", "src/index.ts"]
cwd = "{{ env.DEVHOST_DEMO_RUNTIME }}/playground/backend"
port = "auto"
host = "{{ env.DEVHOST_DEMO_HOST }}"
path = "/api/*"

[services.web]
primary = true
command = ["bun", "run", "src/index.ts"]
cwd = "{{ env.DEVHOST_DEMO_RUNTIME }}/playground/frontend"
port = "auto"
host = "{{ env.DEVHOST_DEMO_HOST }}"
path = "/"
proxyLocalOrigin = true

[services.web.env]
NODE_ENV = "development"
