<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>devhost promo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/vendor/devhost-tokens.css" />
    <link rel="stylesheet" href="assets/vendor/devhost-film.css" />
    <style>
      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-weight: 100 800;
        src: url("assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--dh-term-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "JetBrains Mono Variable", monospace;
        color: var(--dh-fg);
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #cut-flash {
        position: absolute;
        inset: 0;
        background: var(--dh-fg);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37.3" data-width="1920" data-height="1080">
      <div
        id="el-backdrop"
        data-composition-id="backdrop"
        data-composition-src="compositions/backdrop.html"
        data-start="0"
        data-duration="37.3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Each frame cuts just before its first narration line starts. Two frames hold a second line over their last shot. -->
      <div
        id="el-01-hook"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.1"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-02-promise"
        data-composition-id="02-promise"
        data-composition-src="compositions/frames/02-promise.html"
        data-start="4.1"
        data-duration="7.3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-03-start"
        data-composition-id="03-start"
        data-composition-src="compositions/frames/03-start.html"
        data-start="11.4"
        data-duration="7.1"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-04-devtools"
        data-composition-id="04-devtools"
        data-composition-src="compositions/frames/04-devtools.html"
        data-start="18.5"
        data-duration="7.3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-05-agent"
        data-composition-id="05-agent"
        data-composition-src="compositions/frames/05-agent.html"
        data-start="25.8"
        data-duration="7.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-06-close"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="33"
        data-duration="4.3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div id="cut-flash"></div>

      <!-- One bus lifts every narration line to the same level under one ceiling. -->
      <hf-audio-group
        id="voiceover"
        data-label="Voiceover"
        data-fx-chain='{"version":1,"nodes":[{"type":"gain","id":"n1","label":"Voice level","params":{"gain":5}},{"type":"limiter","id":"n2","label":"Ceiling","params":{"limit":-3}}]}'
      ></hf-audio-group>
      <audio
        id="voice-line-1"
        data-narration="line-1"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-1.mp3"
        data-start="0.25"
        data-duration="3.72"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-2"
        data-narration="line-2"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-2.mp3"
        data-start="4.05"
        data-duration="7.68"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-3"
        data-narration="line-3"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-3.mp3"
        data-start="11.8"
        data-duration="6.69"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-4"
        data-narration="line-4"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-4.mp3"
        data-start="18.6"
        data-duration="4.19"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-5"
        data-narration="line-5"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-5.mp3"
        data-start="23.05"
        data-duration="2.59"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-6"
        data-narration="line-6"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-6.mp3"
        data-start="26"
        data-duration="4.78"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-7"
        data-narration="line-7"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-7.mp3"
        data-start="31.1"
        data-duration="1.64"
        data-track-index="10"
        data-volume="1"
      ></audio>
      <audio
        id="voice-line-8"
        data-narration="line-8"
        data-audio-group="voiceover"
        src="assets/audio/voice/line-8.mp3"
        data-start="33.3"
        data-duration="3.42"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // One white frame marks each cut.
      for (const cut of [4.1, 11.4, 18.5, 25.8, 30.9, 33]) {
        tl.set("#cut-flash", { opacity: 0.55 }, cut);
        tl.to("#cut-flash", { opacity: 0, duration: 0.28, ease: "power2.out" }, cut);
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
