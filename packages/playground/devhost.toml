name = "playground"

[caddy.global]
http = true
httpPort = 80
bindHost = "0.0.0.0"

[devtools.status]
position = "bottom-right"

[annotation]
defaultAction = "ask-pi"

[[annotation.actions]]
id = "ask-pi"
label = "Ask Pi"
kind = "agent"

[annotation.actions.agent]
adapter = "pi"

[[annotation.actions]]
id = "build"
label = "Build Playground"
kind = "command"

[annotation.actions.command]
command = ["bun", "run", "build"]
cwd = "."

[services.backend]
command = ["bun", "run", "dev"]
cwd = "backend"
port = 3000
host = "api-devbox.cvb.lol"

[services.frontend]
primary = true
command = ["bun", "run", "dev"]
cwd = "frontend"
port = 3001
host = "devhost-devbox.cvb.lol"

[services.frontend.env]
NODE_ENV = "development"
BUN_PUBLIC_API_URL = "https://api-devbox.cvb.lol"

[services.agent-browser-dashboard]
port = 4848
host = "ab-devbox.cvb.lol"

[services.agent-browser-dashboard.lifecycle]
mode = "daemon"
start = ["agent-browser", "dashboard", "start"]
stop = ["agent-browser", "dashboard", "stop"]
